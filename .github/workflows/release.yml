name: Release (NativeAOT)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version prefix or full version (defaults to Version.props / git tag)"
        required: false
        default: ""
      channel:
        description: "Distribution channel (auto follows Version.props / tag suffix)"
        required: false
        type: choice
        options:
          - auto
          - release
          - beta
        default: auto
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  PUBLISH_PROJECT: "UotanStudio.Desktop/UotanStudio.Desktop.csproj"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows
            runner: windows-latest
          - rid: win-arm64
            os: windows
            runner: windows-11-arm
          - rid: linux-x64
            os: linux
            runner: ubuntu-24.04
          - rid: linux-arm64
            os: linux
            runner: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos
            runner: macos-latest
          - rid: osx-arm64
            os: macos
            runner: macos-latest
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          file_prefix=$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Version.props | head -1)
          file_channel=$(sed -n 's:.*<VersionChannel>\([^<]*\)</VersionChannel>.*:\1:p' Version.props | head -1)
          prefix="${file_prefix:-1.0.0}"
          channel="${file_channel:-beta}"
          version=""

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            prefix="${tag%%-*}"
            case "$tag" in
              *-beta*) channel=beta ;;
              *) channel=release ;;
            esac
            version="$tag"
          fi

          input_version="${{ github.event.inputs.version }}"
          if [ -n "$input_version" ]; then
            version="${input_version#v}"
            prefix="${version%%-*}"
            if [[ "$version" == *-beta* ]]; then
              channel=beta
            else
              channel=release
            fi
          fi

          input_channel="${{ github.event.inputs.channel }}"
          if [ -n "$input_channel" ] && [ "$input_channel" != "auto" ]; then
            channel="$input_channel"
          fi

          if [ -z "$version" ]; then
            if [ "$channel" = "release" ]; then
              version="$prefix"
            else
              version="$prefix-$channel.$GITHUB_RUN_NUMBER"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version ($channel)"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install NativeAOT toolchain (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev libicu-dev
          clang --version

      - name: Install NativeAOT toolchain (macOS)
        if: matrix.os == 'macos'
        run: |
          xcode-select --install || true
          sudo xcodebuild -license accept || true
          clang --version

      - name: Publish NativeAOT (${{ matrix.rid }})
        shell: bash
        run: |
          dotnet publish "$PUBLISH_PROJECT" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishAot=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:Version="${{ steps.ver.outputs.version }}" \
            -p:VersionChannel="${{ steps.ver.outputs.channel }}" \
            -o "$RUNNER_TEMP/publish"

      - name: "Package (Windows: zip)"
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "pkg"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $exclude = @('*.pdb', '*.dbg', '*.xml')
          Get-ChildItem "$env:RUNNER_TEMP/publish" -Recurse -File |
            Where-Object {
              $name = $_.Name; $p = $_.FullName
              -not (($exclude | Where-Object { $name -like $_ }) -or ($p -like "*.dSYM*"))
            } |
            ForEach-Object {
              $rel = $_.FullName.Substring("$env:RUNNER_TEMP/publish".Length).TrimStart('\','/')
              $dst = Join-Path $stage $rel
              if ($_.PSIsContainer) { New-Item -ItemType Directory -Force -Path $dst | Out-Null }
              else { New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null; Copy-Item $_.FullName $dst -Force }
            }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "$env:RUNNER_TEMP/uotanstudio-${{ matrix.rid }}.zip" -Force

      - name: "Package (Unix: tar.gz)"
        if: matrix.os != 'windows'
        shell: bash
        run: |
          cd "$RUNNER_TEMP/publish"
          find . -type f \( -name "*.pdb" -o -name "*.dbg" -o -name "*.xml" \) -delete
          rm -rf *.dSYM
          chmod +x UotanStudio.Desktop 2>/dev/null || true
          find . -type d -empty -delete
          tar -czf "$RUNNER_TEMP/uotanstudio-${{ matrix.rid }}.tar.gz" -C "$RUNNER_TEMP/publish" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uotanstudio-${{ steps.ver.outputs.version }}-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/uotanstudio-${{ matrix.rid }}.zip
            ${{ runner.temp }}/uotanstudio-${{ matrix.rid }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*/*
          generate_release_notes: true
