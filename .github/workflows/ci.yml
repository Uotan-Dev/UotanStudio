name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-format-test:
    name: windows / net10
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore UotanStudio.slnx

      - name: Build
        run: dotnet build UotanStudio.slnx --no-restore --nologo -c Release

      - name: Format (whitespace)
        run: dotnet format UotanStudio.slnx whitespace --no-restore --verify-no-changes

      - name: Format (style)
        run: dotnet format UotanStudio.slnx style --no-restore --verify-no-changes

      - name: Test
        # Bound the full-suite run: the whole assembly set finishes in about two minutes, so a run that
        # exceeds this cap is a hung collection rather than slow work, and it must not hold the runner.
        timeout-minutes: 5
        run: dotnet test --solution UotanStudio.slnx --no-restore -c Release --minimum-expected-tests 7000
