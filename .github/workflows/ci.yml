name: Release (NativeAOT)

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      rid:
        description: "Comma-separated RIDs (empty = all)"
        required: false
        type: string
        default: ""
      version:
        description: "Override version (defaults to Version.props / git tag)"
        required: false
        type: string
        default: ""
      channel:
        description: "release / beta / auto"
        required: false
        type: string
        default: auto
      sdk_release:
        description: "Cross SDK tag (empty = newest matching the SDK band)"
        required: false
        type: string
        default: ""
      runtime_tag:
        description: "dotnet/runtime ABI tag for the cross JIT and ILCompiler host pack (empty = derive from the SDK band)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      rid:
        description: "Comma-separated RIDs (empty = all)"
        required: false
        default: ""
      version:
        description: "Override version (defaults to Version.props / git tag)"
        required: false
        default: ""
      channel:
        description: "release / beta / auto"
        required: false
        type: choice
        options:
          - auto
          - release
          - beta
        default: auto
      sdk_release:
        description: "Cross SDK tag (empty = newest matching the SDK band)"
        required: false
        default: ""
      runtime_tag:
        description: "dotnet/runtime ABI tag for the cross JIT and ILCompiler host pack (empty = derive from the SDK band)"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  PUBLISH_PROJECT: "UotanStudio.Desktop/UotanStudio.Desktop.csproj"
jobs:
  gate:
    name: gate (build + format + test)
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.0.x"

      - name: Restore
        run: dotnet restore UotanStudio.slnx

      - name: Build
        run: dotnet build UotanStudio.slnx --no-restore --nologo -c Release

      - name: Format (whitespace)
        run: dotnet format UotanStudio.slnx whitespace --no-restore --verify-no-changes

      - name: Format (style)
        run: dotnet format UotanStudio.slnx style --no-restore --verify-no-changes

      - name: Test
        timeout-minutes: 15
        run: dotnet test --solution UotanStudio.slnx --no-restore -c Release --minimum-expected-tests 6000

  prepare:
    name: Resolve matrix and version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      run_cross: ${{ steps.resolve.outputs.run_cross }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve matrix and version
        id: resolve
        shell: bash
        env:
          RID_INPUT: ${{ inputs.rid || github.event.inputs.rid }}
          INPUT_VERSION: ${{ inputs.version || github.event.inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel || github.event.inputs.channel || 'auto' }}
        run: |
          set -euo pipefail

          declare -A runners=(
            [win-x64]=windows-2025
            [win-arm64]=windows-11-arm
            [linux-x64]=ubuntu-24.04
            [linux-arm64]=ubuntu-24.04-arm
            [linux-musl-x64]=ubuntu-24.04
            [linux-musl-arm64]=ubuntu-24.04-arm
            [osx-x64]=macos-15-intel
            [osx-arm64]=macos-15
          )
          declare -A platforms=(
            [win-x64]=windows
            [win-arm64]=windows
            [linux-x64]=linux
            [linux-arm64]=linux
            [linux-musl-x64]=linux
            [linux-musl-arm64]=linux
            [osx-x64]=macos
            [osx-arm64]=macos
          )
          declare -A distros=(
            [linux-x64]=glibc
            [linux-arm64]=glibc
            [linux-musl-x64]=musl
            [linux-musl-arm64]=musl
          )
          all_rids=(win-x64 win-arm64 linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64 osx-x64 osx-arm64)
          cross_rids=(linux-riscv64 linux-loongarch64)

          requested="${RID_INPUT:-}"
          selected=()
          declare -A seen=()
          if [ -z "${requested//[[:space:],]/}" ]; then
            selected=("${all_rids[@]}")
          else
            IFS=', ' read -r -a parts <<< "$requested"
            for rid in "${parts[@]}"; do
              if [ -z "$rid" ]; then
                continue
              fi
              if [ -z "${runners[$rid]+x}" ] && ! printf '%s\n' "${cross_rids[@]}" | grep -qx "$rid"; then
                echo "::error::Unsupported RID '$rid'. Stable RIDs: ${all_rids[*]}; cross RIDs: ${cross_rids[*]}; or leave empty for all." >&2
                exit 1
              fi
              if [ -z "${seen[$rid]+x}" ]; then
                seen[$rid]=1
                selected+=("$rid")
              fi
            done
          fi

          run_cross=false
          for rid in "${cross_rids[@]}"; do
            if printf '%s\n' "${selected[@]}" | grep -qx "$rid"; then
              run_cross=true
            fi
          done
          if [ "${requested//[[:space:],]/}" = "" ]; then
            run_cross=true
          fi

          entries=()
          for rid in "${selected[@]}"; do
            [ -n "${runners[$rid]+x}" ] || continue
            entries+=("{\"rid\":\"$rid\",\"os\":\"${platforms[$rid]}\",\"runner\":\"${runners[$rid]}\",\"distro\":\"${distros[$rid]:-}\"}")
          done
          if [ "${#entries[@]}" -eq 0 ]; then
            echo "::error::No stable RIDs selected; nothing to build." >&2
            exit 1
          fi
          joined=$(IFS=,; printf '%s' "${entries[*]}")
          echo "matrix={\"include\":[$joined]}" >> "$GITHUB_OUTPUT"
          echo "run_cross=$run_cross" >> "$GITHUB_OUTPUT"
          echo "Selected stable RIDs: $(printf '%s ' "${selected[@]}")"
          echo "Cross builds: $run_cross"

          file_prefix=$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Version.props | head -1)
          file_channel=$(sed -n 's:.*<VersionChannel>\([^<]*\)</VersionChannel>.*:\1:p' Version.props | head -1)
          prefix="${file_prefix:-1.0.0}"
          channel="${file_channel:-beta}"
          version=""

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            prefix="${tag%%-*}"
            case "$tag" in
              *-beta*) channel=beta ;;
              *) channel=release ;;
            esac
            version="$tag"
          fi

          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
            prefix="${version%%-*}"
            if [[ "$version" == *-beta* ]]; then
              channel=beta
            else
              channel=release
            fi
          fi

          if [ -n "$INPUT_CHANNEL" ] && [ "$INPUT_CHANNEL" != "auto" ]; then
            channel="$INPUT_CHANNEL"
          fi

          if [ -z "$version" ]; then
            if [ "$channel" = "release" ]; then
              version="$prefix"
            else
              version="$prefix-$channel.$GITHUB_RUN_NUMBER"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "::notice::Version $version ($channel); cross builds $run_cross"

  build:
    needs: prepare
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Cache NuGet packages
        if: ${{ !contains(matrix.rid, 'musl') }}
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.rid }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ matrix.rid }}-

      - name: Cache NuGet packages (musl container)
        if: ${{ contains(matrix.rid, 'musl') }}
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/home/.nuget
          key: nuget-${{ matrix.rid }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ matrix.rid }}-

      - name: Setup .NET
        if: ${{ !contains(matrix.rid, 'musl') }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.0.x"

      - name: Install NativeAOT toolchain (Linux)
        if: ${{ matrix.os == 'linux' && !contains(matrix.rid, 'musl') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev libicu-dev
          clang --version

      - name: Install NativeAOT toolchain (macOS)
        if: matrix.os == 'macos'
        run: |
          xcode-select --install || true
          sudo xcodebuild -license accept || true
          clang --version

      - name: Publish NativeAOT (${{ matrix.rid }})
        if: ${{ !contains(matrix.rid, 'musl') }}
        shell: bash
        run: |
          dotnet publish "$PUBLISH_PROJECT" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:Version="${{ needs.prepare.outputs.version }}" \
            -p:VersionChannel="${{ needs.prepare.outputs.channel }}" \
            -o "$RUNNER_TEMP/publish"

      - name: Publish NativeAOT in alpine container (${{ matrix.rid }})
        if: ${{ contains(matrix.rid, 'musl') }}
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publish" "$RUNNER_TEMP/home"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$RUNNER_TEMP/publish:/out" \
            -v "$RUNNER_TEMP/home:/dotnet-home" \
            -e VERSION="$VERSION" -e CHANNEL="$CHANNEL" \
            -e PUBLISH_PROJECT="$PUBLISH_PROJECT" \
            -e MATRIX_RID="${{ matrix.rid }}" \
            mcr.microsoft.com/dotnet/sdk:11.0-alpine \
            sh -c 'apk add --no-cache clang gcc zlib-dev binutils >/dev/null &&
              export DOTNET_CLI_HOME=/dotnet-home DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 &&
              dotnet publish "/src/$PUBLISH_PROJECT" \
                -c Release -r "$MATRIX_RID" --self-contained true \
                -p:DebugType=none -p:DebugSymbols=false \
                -p:Version="$VERSION" -p:VersionChannel="$CHANNEL" \
                -o /out'
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/home"

      - name: "Package (Windows: zip)"
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "pkg"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $exclude = @('*.pdb', '*.dbg', '*.xml')
          Get-ChildItem "$env:RUNNER_TEMP/publish" -Recurse -File |
            Where-Object {
              $name = $_.Name; $p = $_.FullName
              -not (($exclude | Where-Object { $name -like $_ }) -or ($p -like "*.dSYM*"))
            } |
            ForEach-Object {
              $rel = $_.FullName.Substring("$env:RUNNER_TEMP/publish".Length).TrimStart('\','/')
              $dst = Join-Path $stage $rel
              if ($_.PSIsContainer) { New-Item -ItemType Directory -Force -Path $dst | Out-Null }
              else { New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null; Copy-Item $_.FullName $dst -Force }
            }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "$env:RUNNER_TEMP/uotanstudio-${{ matrix.rid }}.zip" -Force

      - name: "Package (Unix: tar.gz)"
        if: matrix.os != 'windows'
        shell: bash
        run: |
          cd "$RUNNER_TEMP/publish"
          find . -type f \( -name "*.pdb" -o -name "*.dbg" -o -name "*.xml" \) -delete
          rm -rf *.dSYM
          chmod +x UotanStudio.Desktop 2>/dev/null || true
          find . -type d -empty -delete
          rid="${{ matrix.rid }}"
          distro="${{ matrix.distro }}"
          if [ -n "$distro" ]; then
            pkg_rid="linux-$distro-${rid#linux-}"
          else
            pkg_rid="$rid"
          fi
          tar -czf "$RUNNER_TEMP/uotanstudio-$pkg_rid.tar.gz" -C "$RUNNER_TEMP/publish" .
          echo "Packaged as uotanstudio-$pkg_rid.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uotanstudio-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/uotanstudio-*.zip
            ${{ runner.temp }}/uotanstudio-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  cross:
    name: cross ${{ matrix.arch }}
    needs: prepare
    if: github.event_name != 'pull_request' && needs.prepare.outputs.run_cross == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            sdk_repo: filipnavara/dotnet-riscv
            cross_image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-riscv64
            elf: RISC-V
          - arch: loongarch64
            sdk_repo: loongson/dotnet
            cross_image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-loongarch64
            elf: LoongArch
    env:
      CROSS_IMAGE: ${{ matrix.cross_image }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve community SDK
        id: sdk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.sdk_release || github.event.inputs.sdk_release }}
          WANT_RUNTIME_TAG: ${{ inputs.runtime_tag || github.event.inputs.runtime_tag }}
        run: |
          set -euo pipefail
          tfm=$(sed -n 's/.*<TargetFramework[^>]*>net\([0-9][0-9.]*\).*<\/TargetFramework>.*/\1/p' Directory.Build.props | head -1)
          want="${WANT:-$(printf '%s' "$tfm" | cut -d. -f1,2)}"
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            -o releases.json "https://api.github.com/repos/${{ matrix.sdk_repo }}/releases?per_page=100"
          resolved=$(jq -r --arg want "$want" '
            [ .[] | select(.draft == false) | . as $rel | (.assets // [])[]
              | select(.state == "uploaded")
              | select(.name | startswith("dotnet-sdk-"))
              | select(.name | endswith("-linux-${{ matrix.arch }}.tar.gz"))
              | select((.name | contains("musl")) | not)
              | { tag: $rel.tag_name, published: ($rel.published_at // ""),
                  version: (.name | sub("^dotnet-sdk-"; "") | sub("-linux-.*$"; "")) } ]
            | map(select(.version | startswith($want)))
            | sort_by(.published) | reverse | .[0]
            | if . == null then "" else [.tag, .version] | @tsv end' releases.json)
          if [ -z "$resolved" ]; then
            echo "::error::No ${{ matrix.sdk_repo }} SDK release matches prefix '$want'." >&2
            exit 1
          fi
          IFS=$'\t' read -r tag ver <<< "$resolved"
          if [ -z "$tag" ] || [ -z "$ver" ]; then
            echo "::error::Resolved release is missing a tag or version ('$resolved')." >&2
            exit 1
          fi
          sdk_url=$(jq -r --arg tag "$tag" --arg ver "$ver" '
            [.[] | select(.tag_name == $tag) | .assets // [] | .[]
              | select(.name == "dotnet-sdk-" + $ver + "-linux-${{ matrix.arch }}.tar.gz")][0].browser_download_url // ""' releases.json)
          sdk_digest=$(jq -r --arg tag "$tag" --arg ver "$ver" '
            [.[] | select(.tag_name == $tag) | .assets // [] | .[]
              | select(.name == "dotnet-sdk-" + $ver + "-linux-${{ matrix.arch }}.tar.gz")][0].digest // ""' releases.json)
          artifacts_url=$(jq -r --arg tag "$tag" '
            [.[] | select(.tag_name == $tag) | .assets // [] | .[]
              | select(.state == "uploaded")
              | select(.name | startswith("Private.SourceBuilt.Artifacts."))
              | select(.name | endswith(".linux-${{ matrix.arch }}.tar.gz"))
              | select((.name | contains("musl")) | not)
              | .browser_download_url][0] // ""' releases.json)
          if [ -z "$sdk_url" ] || [ -z "$artifacts_url" ]; then
            echo "::error::Release $tag is missing the SDK or Private.SourceBuilt.Artifacts asset." >&2
            exit 1
          fi
          for pair in "sdk_url=$sdk_url" "artifacts_url=$artifacts_url"; do
            value="${pair#*=}"
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::Release $tag resolved a null asset URL for ${pair%%=*}." >&2
              exit 1
            fi
          done
          runtime_tag="$WANT_RUNTIME_TAG"
          if [ -z "$runtime_tag" ]; then
            sdk3=$(printf '%s' "$ver" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
            if [ -z "$sdk3" ]; then
              echo "::error::Cannot derive a runtime ABI version from SDK version '$ver'." >&2
              exit 1
            fi
            runtime_tag=$(printf '%s' "$sdk3" | awk -F. '{ p = int($3 / 100) - 1; if (p < 0) p = 0; printf "%s.%s.%d", $1, $2, p }')
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "runtime_ver=$runtime_tag" >> "$GITHUB_OUTPUT"
          echo "sdk_url=$sdk_url" >> "$GITHUB_OUTPUT"
          echo "sdk_digest=$sdk_digest" >> "$GITHUB_OUTPUT"
          echo "artifacts_url=$artifacts_url" >> "$GITHUB_OUTPUT"
          echo "::notice::${{ matrix.sdk_repo }} SDK $tag ($ver), runtime ABI $runtime_tag"

      - name: Restore toolchain cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/cross/nuget-local
            ${{ runner.temp }}/cross/ilc-host-x64
            ${{ runner.temp }}/cross/home/.nuget
          key: ${{ matrix.arch }}-toolchain-v2-${{ steps.sdk.outputs.tag }}-${{ steps.sdk.outputs.runtime_ver }}
          restore-keys: ${{ matrix.arch }}-toolchain-v2-${{ steps.sdk.outputs.tag }}-

      - name: Download SDKs and artifacts
        shell: bash
        env:
          SDK_URL: ${{ steps.sdk.outputs.sdk_url }}
          SDK_DIGEST: ${{ steps.sdk.outputs.sdk_digest }}
          ARTIFACTS_URL: ${{ steps.sdk.outputs.artifacts_url }}
          SDK_VER: ${{ steps.sdk.outputs.ver }}
          RUNTIME_VER: ${{ steps.sdk.outputs.runtime_ver }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cross"
          mkdir -p "$work"
          official=$(printf '%s' "$SDK_VER" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$official" ]; then
            echo "::error::Cannot derive an official SDK version from tag '$SDK_VER'." >&2
            exit 1
          fi

          sdk_arch="$work/sdk-${{ matrix.arch }}.tar.gz"
          sdk_x64="$work/sdk-x64.tar.gz"
          feed_ready=0
          if [ -f "$work/nuget-local/.toolchain-ready" ] \
             && [ -s "$work/ilc-host-x64/tools/ilc" ] \
             && [ -s "$work/ilc-host-x64/tools/libjitinterface_x64.so" ]; then
            feed_ready=1
          fi

          p1=""; p2=""; p3=""; p4=""
          if [ ! -s "$sdk_arch" ]; then
            curl -fL --retry 3 -o "$sdk_arch" "$SDK_URL" & p1=$!
          fi
          if [ ! -s "$sdk_x64" ]; then
            curl -fL --retry 3 -o "$sdk_x64" \
              "https://builds.dotnet.microsoft.com/dotnet/Sdk/$official/dotnet-sdk-$official-linux-x64.tar.gz" & p2=$!
          fi
          if [ "$feed_ready" -eq 1 ]; then
            echo "Toolchain feed restored from cache; downloading only the SDK tarballs."
          else
            curl -fL --retry 3 -o "$work/artifacts-${{ matrix.arch }}.tar.gz" "$ARTIFACTS_URL" & p3=$!
            curl -fL --retry 3 -o "$work/ilc-host-x64.nupkg" \
              "https://api.nuget.org/v3-flatcontainer/runtime.linux-x64.microsoft.dotnet.ilcompiler/$RUNTIME_VER/runtime.linux-x64.microsoft.dotnet.ilcompiler.$RUNTIME_VER.nupkg" & p4=$!
          fi
          status=0
          for p in $p1 $p2 $p3 $p4; do wait "$p" || status=1; done
          [ "$status" -eq 0 ] || { echo "::error::One or more downloads failed." >&2; exit 1; }

          [ -s "$sdk_arch" ] || { echo "::error::The ${{ matrix.arch }} SDK download produced no $sdk_arch." >&2; exit 1; }
          [ -s "$sdk_x64" ] || { echo "::error::The official host SDK download produced no $sdk_x64." >&2; exit 1; }
          if [[ "$SDK_DIGEST" == sha256:* ]]; then
            echo "${SDK_DIGEST#sha256:}  $sdk_arch" | sha256sum -c -
          else
            echo "::warning::SDK asset has no sha256 digest; skipping the integrity check."
          fi

          if [ "$feed_ready" -eq 0 ]; then
            unzip -q -o "$work/ilc-host-x64.nupkg" -d "$work/ilc-host-x64"
            for f in tools/ilc tools/libjitinterface_x64.so; do
              [ -f "$work/ilc-host-x64/$f" ] || { echo "::error::ILCompiler host pack is missing $f." >&2; exit 1; }
            done
            file "$work/ilc-host-x64/tools/ilc" | grep -q "x86-64" || {
              echo "::error::tools/ilc is not an x86-64 binary." >&2
              exit 1
            }
          fi

      - name: Prepare local feed
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cross"
          mkdir -p "$work/nuget-local"
          if [ -f "$work/nuget-local/.toolchain-ready" ]; then
            echo "Feed already prepared; skipping."
            exit 0
          fi

          artlist=$(tar tzf "$work/artifacts-${{ matrix.arch }}.tar.gz")
          pick() { printf '%s\n' "$artlist" | grep -E "^$1\$" | head -1; }
          naot=$(pick "Microsoft\.NETCore\.App\.Runtime\.NativeAOT\.linux-${{ matrix.arch }}\.[0-9][^/]*\.nupkg")
          ref=$(pick "Microsoft\.NETCore\.App\.Ref\.[0-9][^/]*\.nupkg")
          host=$(pick "Microsoft\.NETCore\.App\.Host\.linux-${{ matrix.arch }}\.[0-9][^/]*\.nupkg")
          runtime=$(pick "Microsoft\.NETCore\.App\.Runtime\.linux-${{ matrix.arch }}\.[0-9][^/]*\.nupkg")
          ilc=$(pick "runtime\.linux-${{ matrix.arch }}\.Microsoft\.DotNet\.ILCompiler\.[0-9][^/]*\.nupkg")
          ilcm=$(pick "Microsoft\.DotNet\.ILCompiler\.[0-9][^/]*\.nupkg")
          aspnet=$(pick "Microsoft\.AspNetCore\.App\.Runtime\.linux-${{ matrix.arch }}\.[0-9][^/]*\.nupkg")
          aspnetref=$(pick "Microsoft\.AspNetCore\.App\.Ref\.[0-9][^/]*\.nupkg")
          paths=()
          for p in "$naot" "$ref" "$host" "$runtime" "$ilc" "$ilcm" "$aspnet" "$aspnetref"; do
            [ -n "$p" ] || { echo "::error::Required package missing from Private.SourceBuilt.Artifacts." >&2; exit 1; }
            paths+=("$p")
          done
          tar xzf "$work/artifacts-${{ matrix.arch }}.tar.gz" -C "$work/nuget-local" "${paths[@]}"

          unzip -q -o "$work/nuget-local/$ilcm" -d "$work/ilc-nupkg"
          python3 - "$work/ilc-nupkg/build/Microsoft.NETCore.Native.Unix.targets" <<'PY'
          import sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              text = handle.read()
          anchor = """<CrossCompileArch Condition="'$(_hostArchitecture)' != '$(_targetArchitecture)'">$(_targetArchitecture)</CrossCompileArch>"""
          patch = anchor + """
              <CrossCompileArch Condition="'$(_targetArchitecture)' == '' and '$(RuntimeIdentifier)' == 'linux-${{ matrix.arch }}'">${{ matrix.arch }}</CrossCompileArch>"""
          if "linux-${{ matrix.arch }}'\">${{ matrix.arch }}" not in text:
              if anchor not in text:
                  raise SystemExit("CrossCompileArch anchor not found")
              text = text.replace(anchor, patch)
          with open(path, "w", encoding="utf-8") as handle:
              handle.write(text)
          PY
          (cd "$work/ilc-nupkg" && zip -qr "$work/nuget-local/$ilcm" .)
          touch "$work/nuget-local/.toolchain-ready"

      - name: Restore cross natives cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cross/natives/out
          key: ${{ matrix.arch }}-natives-v1-${{ runner.os }}-oniguruma6.9.10-portapty2.2.4

      - name: Build cross native libraries
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cross"
          natives="$work/natives"
          mkdir -p "$natives/out"
          libs=("$natives/out/libonigwrap.so" "$natives/out/libporta_pty.so")
          if [ -f "${libs[0]}" ] && [ -f "${libs[1]}" ]; then
            echo "Cross native libraries restored from cache."
          else
            src="$natives/src"
            mkdir -p "$src"
            onigwrap="$src/onigwrap"
            git init -q "$onigwrap"
            git -C "$onigwrap" remote add origin https://github.com/aikawayataro/Onigwrap
            git -C "$onigwrap" fetch -q --depth 1 origin 98683ee59d6d18d5aa579a11499cde753e5a6b34
            git -C "$onigwrap" checkout -q FETCH_HEAD
            portapty="$src/portapty"
            git init -q "$portapty"
            git -C "$portapty" remote add origin https://github.com/tomlm/Porta.Pty
            git -C "$portapty" fetch -q --depth 1 origin 5fd8cc38428b345e252327bf6b438bee6c6a62a6
            git -C "$portapty" checkout -q FETCH_HEAD
            curl -fL --retry 3 -o "$src/onig.tar.gz" \
              "https://github.com/kkos/oniguruma/releases/download/v6.9.10/onig-6.9.10.tar.gz"
            mkdir "$src/oniguruma"
            tar xzf "$src/onig.tar.gz" -C "$src/oniguruma" --strip-components=1
            rm "$src/onig.tar.gz"
            docker run --rm --platform linux/amd64 \
              -v "$src:/natives-src" \
              -v "$GITHUB_WORKSPACE:/work/src:ro" \
              "$CROSS_IMAGE" bash /work/src/tools/cross-natives/build.sh ${{ matrix.arch }} /natives-src /natives-src/out
            cp "$src/out/"*.so "$natives/out/"
          fi
          readelf -h "${libs[0]}" | grep -q ${{ matrix.elf }} || { echo "::error::libonigwrap.so is not a ${{ matrix.arch }} ELF." >&2; exit 1; }
          readelf -h "${libs[1]}" | grep -q ${{ matrix.elf }} || { echo "::error::libporta_pty.so is not a ${{ matrix.arch }} ELF." >&2; exit 1; }

      - name: Restore ${{ matrix.arch }} cross JIT cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cross/crossjit
          key: ${{ matrix.arch }}-crossjit-${{ runner.os }}-v${{ steps.sdk.outputs.runtime_ver }}

      - name: Restore cross JIT artifact
        id: jit_artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/cross/crossjit"
          jit="$dest/libclrjit_unix_${{ matrix.arch }}_x64.so"
          if [ -f "$jit" ]; then
            echo "Cross JIT already restored from cache."
            exit 0
          fi
          mkdir -p "$dest"
          tmp=$(mktemp -d)
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            [ "$run_id" != "$GITHUB_RUN_ID" ] || continue
            rm -rf "${tmp:?}"
            mkdir -p "$tmp"
            if gh run download "$run_id" -n ${{ matrix.arch }}-crossjit -D "$tmp" 2>/dev/null; then
              found=$(find "$tmp" -name 'libclrjit_unix_${{ matrix.arch }}_x64.so' -print -quit)
              if [ -n "$found" ]; then
                cp "$found" "$jit"
                echo "Cross JIT restored from run $run_id."
                exit 0
              fi
            fi
          done < <(gh run list --workflow "${{ github.workflow }}" --limit 15 \
                     --json databaseId --jq '.[].databaseId')
          echo "No earlier run provided the cross JIT artifact; it will be built now."

      - name: Build ${{ matrix.arch }} cross JIT (first run only)
        shell: bash
        env:
          RUNTIME_VER: ${{ steps.sdk.outputs.runtime_ver }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cross"
          mkdir -p "$work/crossjit"
          jit="$work/crossjit/libclrjit_unix_${{ matrix.arch }}_x64.so"
          if [ -f "$jit" ]; then
            echo "Cross JIT restored from cache or artifact."
            file "$jit"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y build-essential cmake llvm lld clang \
            python-is-python3 curl git libicu-dev liblttng-ust-dev \
            libssl-dev libkrb5-dev ninja-build pigz cpio binutils file
          src="$RUNNER_TEMP/runtime-src"
          git clone --depth 1 --branch "v$RUNTIME_VER" https://github.com/dotnet/runtime "$src"
          cd "$src"
          ./build.sh clr.alljitscommunity -c release
          built=$(find "$src/artifacts/bin" -name 'libclrjit_unix_${{ matrix.arch }}_x64.so' -print -quit)
          if [ -z "$built" ]; then
            echo "::error::Build produced no libclrjit_unix_${{ matrix.arch }}_x64.so." >&2
            echo "Artifacts containing 'clrjit':" >&2
            find "$src/artifacts/bin" -name '*clrjit*' -printf '  %p\n' 2>/dev/null >&2 || true
            exit 1
          fi
          file "$built"
          nm -D "$built" | grep -qE ' getJit(@@|$)' || {
            echo "::error::Built JIT does not export getJit." >&2
            exit 1
          }
          file "$built" | grep -q "x86-64" || {
            echo "::error::Built JIT is not an x86-64 ELF; the host build did not produce a host-loadable JIT." >&2
            exit 1
          }
          cp "$built" "$jit"
          cd /
          rm -rf "$src"
          echo "Staged cross JIT as $jit"

      - name: Upload cross JIT
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}-crossjit
          path: ${{ runner.temp }}/cross/crossjit/libclrjit_unix_${{ matrix.arch }}_x64.so
          if-no-files-found: warn
          retention-days: 30

      - name: Stage the cross JIT into the ilc host
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cross"
          jit="$work/crossjit/libclrjit_unix_${{ matrix.arch }}_x64.so"
          [ -f "$jit" ] || { echo "::error::Cross JIT is missing at $jit." >&2; exit 1; }
          cp "$jit" "$work/ilc-host-x64/tools/"
          ls -l "$work/ilc-host-x64/tools/"

      - name: Publish NativeAOT (cross container)
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cross"
          mkdir -p "$work/out" "$work/home"
          for f in "$work/sdk-x64.tar.gz" "$work/sdk-${{ matrix.arch }}.tar.gz"; do
            [ -s "$f" ] || { echo "::error::The cross container needs $f but it is missing." >&2; exit 1; }
          done
          cat > "$work/container.sh" <<'CONTAINER'
          set -euo pipefail
          export DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1
          export DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
          export DOTNET_ReadyToRun=0
          export DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER=1
          export DOTNET_CLI_HOME=/work/home HOME=/work/home

          cd /work/src

          mkdir -p /work/dotnet-x64 /work/community
          tar xzf /work/sdk-x64.tar.gz -C /work/dotnet-x64
          tar xzf /work/sdk-${{ matrix.arch }}.tar.gz -C /work/community ./sdk
          official_ver=$(ls /work/dotnet-x64/sdk)
          comm_ver=$(ls /work/community/sdk)
          mkdir -p /tmp/official
          for f in MSBuild libdotnet-aot.so Roslyn/bincore/VBCSCompiler Roslyn/bincore/csc Roslyn/bincore/vbc AppHostTemplate/apphost; do
            mkdir -p "/tmp/official/$(dirname "$f")"
            cp "/work/dotnet-x64/sdk/$official_ver/$f" "/tmp/official/$f"
          done
          rm -rf "/work/dotnet-x64/sdk/$official_ver"
          cp -r "/work/community/sdk/$comm_ver" "/work/dotnet-x64/sdk/$comm_ver"
          for f in MSBuild libdotnet-aot.so Roslyn/bincore/VBCSCompiler Roslyn/bincore/csc Roslyn/bincore/vbc AppHostTemplate/apphost; do
            cp "/tmp/official/$f" "/work/dotnet-x64/sdk/$comm_ver/$f"
          done
          export DOTNET_ROOT=/work/dotnet-x64
          export PATH="/work/dotnet-x64:$PATH"

          cat > /work/src/NuGet.config <<'NUGET'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <Clear />
              <add key="local-${{ matrix.arch }}" value="/work/nuget-local" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          NUGET

          dotnet --info

          dotnet restore "$PUBLISH_PROJECT" -r linux-${{ matrix.arch }} \
            -p:NETCoreSdkPortableRuntimeIdentifier=linux-x64 \
            -p:IlcHostRuntimeIdentifier=linux-x64

          ilc_tools=$(dirname "$(find /work/home/.nuget/packages -maxdepth 5 \
            -path "*runtime.linux-x64.microsoft.dotnet.ilcompiler/*/tools/ilc" | head -1)")
          [ -n "$ilc_tools" ] && [ -d "$ilc_tools" ] || {
            echo "::error::Could not locate the restored ilc host package tools directory." >&2
            exit 1
          }
          echo "ilc host tools: $ilc_tools"
          cp /work/ilc-host-x64/tools/libclrjit_unix_${{ matrix.arch }}_x64.so "$ilc_tools/"
          ls -l "$ilc_tools/libclrjit"*${{ matrix.arch }}*
          export LD_LIBRARY_PATH="$ilc_tools${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          dotnet publish "$PUBLISH_PROJECT" \
            -c Release -r linux-${{ matrix.arch }} --self-contained true \
            --no-restore \
            -p:DebugType=none -p:DebugSymbols=false \
            -p:Version="$VERSION" -p:VersionChannel="$CHANNEL" \
            -p:NETCoreSdkPortableRuntimeIdentifier=linux-x64 \
            -p:IlcHostRuntimeIdentifier=linux-x64 \
            -p:IlcHostPackagePath=/work/ilc-host-x64 \
            -p:SysRoot=/crossrootfs/${{ matrix.arch }} \
            -p:LinkerFlavor=lld \
            -nr:false \
            -o /work/out
          CONTAINER

          docker run --rm --platform linux/amd64 \
            -v "$work:/work" \
            -v "$GITHUB_WORKSPACE:/work/src" \
            -e VERSION="$VERSION" -e CHANNEL="$CHANNEL" \
            -e PUBLISH_PROJECT="$PUBLISH_PROJECT" \
            "$CROSS_IMAGE" bash /work/container.sh

          mkdir -p "$RUNNER_TEMP/publish"
          cp -R "$work/out/." "$RUNNER_TEMP/publish/"
          sudo chown -R "$(id -u):$(id -g)" "$work/home"
          cp "$work/natives/out/libonigwrap.so" "$work/natives/out/libporta_pty.so" "$RUNNER_TEMP/publish/"
          if [ -f "$RUNNER_TEMP/publish/UotanStudio.Desktop" ]; then
            file "$RUNNER_TEMP/publish/UotanStudio.Desktop"
          else
            echo "::warning::UotanStudio.Desktop is missing from the publish output."
          fi
          if ls "$RUNNER_TEMP/publish"/UotanStudio*.dll >/dev/null 2>&1; then
            echo "::warning::Managed assemblies are present in the publish output; the build is not a NativeAOT publish."
          fi
          if [ -f "$RUNNER_TEMP/publish/UotanStudio.Desktop" ]; then
            if readelf -d "$RUNNER_TEMP/publish/UotanStudio.Desktop" 2>/dev/null | grep -q "libcoreclr"; then
              echo "::warning::The published binary links libcoreclr; the build is not a NativeAOT publish."
            fi
          fi
          test -f "$RUNNER_TEMP/publish/libSkiaSharp.so" \
            || echo "::warning::libSkiaSharp.so is missing from the publish output; check the RID asset resolution."
          file "$RUNNER_TEMP/publish/libSkiaSharp.so" 2>/dev/null || true

      - name: Package (tar.gz)
        shell: bash
        run: |
          cd "$RUNNER_TEMP/publish"
          find . -type f \( -name "*.pdb" -o -name "*.dbg" -o -name "*.xml" \) -delete
          chmod +x UotanStudio.Desktop 2>/dev/null || true
          find . -type d -empty -delete
          tar -czf "$RUNNER_TEMP/uotanstudio-linux-${{ matrix.arch }}.tar.gz" -C "$RUNNER_TEMP/publish" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uotanstudio-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/uotanstudio-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [build, cross]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*/*
          generate_release_notes: true
