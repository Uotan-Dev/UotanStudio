name: Publish linux-riscv64 (cross)

# Experimental cross-compilation publish, verified against dotnet-riscv SDK 11.0.100:
# the community SDK ships no x64-hosted ilc, so the x64 ILCompiler host pack runs natively
# and only the RyuJIT it loads emits riscv64 code (built once from dotnet/runtime's
# clr.crossarchtools subset and cached). Nothing executes riscv64 instructions during the
# build. glibc target only; musl is not wired.
# SkiaSharp.NativeAssets.Linux ships runtimes/linux-riscv64/native/libSkiaSharp.so (glibc and
# musl variants) since 3.119.0, so the RID asset resolves and lands in the publish output
# without a source build. The 4.157.0 build is linked against GLIBC_2.38.

on:
  workflow_dispatch:
    inputs:
      sdk_release:
        description: "dotnet-riscv tag (empty = newest 11.0)"
        required: false
        default: ""
      runtime_tag:
        description: "dotnet/runtime ABI tag for the cross JIT and ILCompiler host pack (empty = derive from the SDK band)"
        required: false
        default: ""
      version:
        description: "Override version (defaults to Version.props / run number)"
        required: false
        default: ""

concurrency:
  group: riscv-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  PUBLISH_PROJECT: "UotanStudio.Desktop/UotanStudio.Desktop.csproj"
  CROSS_IMAGE: "mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-riscv64"

jobs:
  publish:
    name: linux-riscv64
    runs-on: ubuntu-24.04
    # 360 is the platform ceiling for a single job. With the qemu-user round trip gone the
    # publish itself is expected to take tens of minutes; the ceiling only covers the
    # first run, which also builds the cross JIT from source.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          prefix=$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Version.props | head -1)
          channel=$(sed -n 's:.*<VersionChannel>\([^<]*\)</VersionChannel>.*:\1:p' Version.props | head -1)
          channel="${channel:-beta}"
          version="${prefix:-1.0.0}-${channel}.${GITHUB_RUN_NUMBER}"
          input="${{ github.event.inputs.version }}"
          if [ -n "$input" ]; then version="${input#v}"; fi
          # The version input replaces the whole version, so a manual dispatch can drop the
          # channel. The publish step forwards both values to MSBuild, and the host project
          # rejects anything other than release or beta, so resolve the channel here and
          # always publish it.
          if [ -z "$version" ] || [ -z "$channel" ]; then
            echo "::error::Resolved version or channel is empty (version='$version', channel='$channel')." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version ($channel)"

      - name: Resolve community SDK
        id: sdk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ github.event.inputs.sdk_release }}
          WANT_RUNTIME_TAG: ${{ github.event.inputs.runtime_tag }}
        run: |
          set -euo pipefail
          tfm=$(sed -n 's/.*<TargetFramework[^>]*>net\([0-9][0-9.]*\).*<\/TargetFramework>.*/\1/p' Directory.Build.props | head -1)
          want="${WANT:-$(printf '%s' "$tfm" | cut -d. -f1,2)}"
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            -o releases.json "https://api.github.com/repos/filipnavara/dotnet-riscv/releases?per_page=100"
          resolved=$(jq -r --arg want "$want" '
            [ .[] | select(.draft == false) | . as $rel | (.assets // [])[]
              | select(.state == "uploaded")
              | select(.name | startswith("dotnet-sdk-"))
              | select(.name | endswith("-linux-riscv64.tar.gz"))
              | select((.name | contains("musl")) | not)
              | { tag: $rel.tag_name, published: ($rel.published_at // ""),
                  version: (.name | sub("^dotnet-sdk-"; "") | sub("-linux-.*$"; "")) } ]
            | map(select(.version | startswith($want)))
            | sort_by(.published) | reverse | .[0]
            | if . == null then "" else [.tag, .version] | @tsv end' releases.json)
          if [ -z "$resolved" ]; then
            echo "::error::No dotnet-riscv SDK release matches prefix '$want'." >&2
            exit 1
          fi
          IFS=$'\t' read -r tag ver <<< "$resolved"
          if [ -z "$tag" ] || [ -z "$ver" ]; then
            echo "::error::Resolved release is missing a tag or version ('$resolved')." >&2
            exit 1
          fi
          sdk_url=$(jq -r --arg tag "$tag" --arg ver "$ver" '
            [.[] | select(.tag_name == $tag) | .assets // [] | .[]
              | select(.name == "dotnet-sdk-" + $ver + "-linux-riscv64.tar.gz")][0].browser_download_url // ""' releases.json)
          sdk_digest=$(jq -r --arg tag "$tag" --arg ver "$ver" '
            [.[] | select(.tag_name == $tag) | .assets // [] | .[]
              | select(.name == "dotnet-sdk-" + $ver + "-linux-riscv64.tar.gz")][0].digest // ""' releases.json)
          # The artifacts asset carries the source-build version, not the SDK version:
          # Private.SourceBuilt.Artifacts.11.0.100-rtm.26561.199.linux-riscv64.tar.gz.
          # Matching "Artifacts.<sdk-version>." therefore yields null and curl then tries to
          # resolve the literal host "null", so select on the prefix and RID suffix only.
          artifacts_url=$(jq -r --arg tag "$tag" '
            [.[] | select(.tag_name == $tag) | .assets // [] | .[]
              | select(.state == "uploaded")
              | select(.name | startswith("Private.SourceBuilt.Artifacts."))
              | select(.name | endswith(".linux-riscv64.tar.gz"))
              | select((.name | contains("musl")) | not)
              | .browser_download_url][0] // ""' releases.json)
          if [ -z "$sdk_url" ] || [ -z "$artifacts_url" ]; then
            echo "::error::Release $tag is missing the SDK or Private.SourceBuilt.Artifacts asset." >&2
            exit 1
          fi
          for pair in "sdk_url=$sdk_url" "artifacts_url=$artifacts_url"; do
            value="${pair#*=}"
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::Release $tag resolved a null asset URL for ${pair%%=*}." >&2
              exit 1
            fi
          done
          # The ILCompiler host pack and the dotnet/runtime sources used to build the cross
          # JIT are versioned by the runtime ABI, which is not the SDK version: SDK 11.0.100
          # maps to runtime 11.0.0. Derive the patch from the SDK band unless the caller
          # pinned a tag, so preview SDKs can be matched against their own runtime branch.
          runtime_tag="$WANT_RUNTIME_TAG"
          if [ -z "$runtime_tag" ]; then
            sdk3=$(printf '%s' "$ver" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
            if [ -z "$sdk3" ]; then
              echo "::error::Cannot derive a runtime ABI version from SDK version '$ver'." >&2
              exit 1
            fi
            runtime_tag=$(printf '%s' "$sdk3" | awk -F. '{ p = int($3 / 100) - 1; if (p < 0) p = 0; printf "%s.%s.%d", $1, $2, p }')
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "runtime_ver=$runtime_tag" >> "$GITHUB_OUTPUT"
          echo "sdk_url=$sdk_url" >> "$GITHUB_OUTPUT"
          echo "sdk_digest=$sdk_digest" >> "$GITHUB_OUTPUT"
          echo "artifacts_url=$artifacts_url" >> "$GITHUB_OUTPUT"
          echo "::notice::dotnet-riscv SDK $tag ($ver), runtime ABI $runtime_tag"

      - name: Download SDKs and artifacts
        shell: bash
        env:
          SDK_URL: ${{ steps.sdk.outputs.sdk_url }}
          SDK_DIGEST: ${{ steps.sdk.outputs.sdk_digest }}
          ARTIFACTS_URL: ${{ steps.sdk.outputs.artifacts_url }}
          TAG: ${{ steps.sdk.outputs.tag }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/riscv"
          mkdir -p "$work"
          curl -fL --retry 3 -o "$work/sdk-riscv64.tar.gz" "$SDK_URL"
          if [[ "$SDK_DIGEST" == sha256:* ]]; then
            echo "${SDK_DIGEST#sha256:}  $work/sdk-riscv64.tar.gz" | sha256sum -c -
          else
            echo "::warning::SDK asset has no sha256 digest; skipping the integrity check."
          fi
          curl -fL --retry 3 -o "$work/artifacts-riscv64.tar.gz" "$ARTIFACTS_URL"
          # Official x64 SDK: derive the branded version from the community tag instead of
          # assuming the tag equals it. Release tags are bare (11.0.100), but preview tags
          # carry branded suffixes (11.0.100-rc.3.26522.148), and only the first three
          # segments exist on builds.dotnet.microsoft.com.
          official=$(printf '%s' "$TAG" | grep -oE '^v?[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$official" ]; then
            echo "::error::Cannot derive an official SDK version from tag '$TAG'." >&2
            exit 1
          fi
          curl -fL --retry 3 -o "$work/sdk-x64.tar.gz" \
            "https://builds.dotnet.microsoft.com/dotnet/Sdk/$official/dotnet-sdk-$official-linux-x64.tar.gz"

      - name: Prepare local feed and ilc host
        shell: bash
        env:
          RUNTIME_VER: ${{ steps.sdk.outputs.runtime_ver }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/riscv"
          mkdir -p "$work/nuget-local" "$work/ilc-host-x64"

          # Runtime pack versions do not map 1:1 from the SDK tag (e.g. 11.0.101 -> 11.0.1,
          # preview tags carry branding suffixes); read the exact names from the archive.
          artlist=$(tar tzf "$work/artifacts-riscv64.tar.gz")
          pick() { printf '%s\n' "$artlist" | grep -E "^$1\$" | head -1; }
          naot=$(pick "Microsoft\.NETCore\.App\.Runtime\.NativeAOT\.linux-riscv64\.[0-9][^/]*\.nupkg")
          ref=$(pick "Microsoft\.NETCore\.App\.Ref\.[0-9][^/]*\.nupkg")
          host=$(pick "Microsoft\.NETCore\.App\.Host\.linux-riscv64\.[0-9][^/]*\.nupkg")
          runtime=$(pick "Microsoft\.NETCore\.App\.Runtime\.linux-riscv64\.[0-9][^/]*\.nupkg")
          ilc=$(pick "runtime\.linux-riscv64\.Microsoft\.DotNet\.ILCompiler\.[0-9][^/]*\.nupkg")
          ilcm=$(pick "Microsoft\.DotNet\.ILCompiler\.[0-9][^/]*\.nupkg")
          aspnet=$(pick "Microsoft\.AspNetCore\.App\.Runtime\.linux-riscv64\.[0-9][^/]*\.nupkg")
          aspnetref=$(pick "Microsoft\.AspNetCore\.App\.Ref\.[0-9][^/]*\.nupkg")
          # The riscv64 ilc package stays in the feed: it carries the native runtime pack the
          # compile targets expect for the target RID. The host pack below is what actually
          # runs, so the two do not conflict.
          paths=()
          for p in "$naot" "$ref" "$host" "$runtime" "$ilc" "$ilcm" "$aspnet" "$aspnetref"; do
            [ -n "$p" ] || { echo "::error::Required package missing from Private.SourceBuilt.Artifacts." >&2; exit 1; }
            paths+=("$p")
          done
          # One list pass plus one extract pass; per-package `-O` pipes would rescan the
          # ~780 MB archive once per package.
          tar xzf "$work/artifacts-riscv64.tar.gz" -C "$work/nuget-local" "${paths[@]}"

          # The official RID graph has no linux-riscv64, so SetupOSSpecificProps leaves
          # CrossCompileArch/TargetTriple empty and the link misses --target. Patch the
          # fallback into the ILCompiler targets before restoring them into the cache.
          unzip -q -o "$work/nuget-local/$ilcm" -d "$work/ilc-nupkg"
          python3 - "$work/ilc-nupkg/build/Microsoft.NETCore.Native.Unix.targets" <<'PY'
          import sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              text = handle.read()
          anchor = """<CrossCompileArch Condition="'$(_hostArchitecture)' != '$(_targetArchitecture)'">$(_targetArchitecture)</CrossCompileArch>"""
          patch = anchor + """
              <CrossCompileArch Condition="'$(_targetArchitecture)' == '' and '$(RuntimeIdentifier)' == 'linux-riscv64'">riscv64</CrossCompileArch>"""
          if "linux-riscv64'\">riscv64" not in text:
              if anchor not in text:
                  raise SystemExit("CrossCompileArch anchor not found")
              text = text.replace(anchor, patch)
          with open(path, "w", encoding="utf-8") as handle:
              handle.write(text)
          PY
          (cd "$work/ilc-nupkg" && zip -qr "$work/nuget-local/$ilcm" .)

          # The host pack supplies the ilc that runs. It ships JITs for the targets Microsoft
          # builds (arm, arm64, wasm, x64), but none for riscv64, which is why the cross JIT
          # built in the next step is copied into tools/ next to it.
          curl -fL --retry 3 -o "$work/ilc-host-x64.nupkg" \
            "https://api.nuget.org/v3-flatcontainer/runtime.linux-x64.microsoft.dotnet.ilcompiler/$RUNTIME_VER/runtime.linux-x64.microsoft.dotnet.ilcompiler.$RUNTIME_VER.nupkg"
          unzip -q -o "$work/ilc-host-x64.nupkg" -d "$work/ilc-host-x64"
          for f in tools/ilc tools/libjitinterface_x64.so; do
            [ -f "$work/ilc-host-x64/$f" ] || { echo "::error::ILCompiler host pack is missing $f." >&2; exit 1; }
          done
          file "$work/ilc-host-x64/tools/ilc" | grep -q "x86-64" || {
            echo "::error::tools/ilc is not an x86-64 binary." >&2
            exit 1
          }

      - name: Restore riscv64 cross JIT cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/riscv/crossjit
          key: riscv64-crossjit-${{ runner.os }}-v${{ steps.sdk.outputs.runtime_ver }}

      # The cache is written by its post-step, which does not run when a job is cancelled by
      # a timeout, so a run cut off mid-build leaves nothing behind. Pull a previously
      # uploaded artifact as a fallback so the expensive build only has to succeed once.
      - name: Restore cross JIT artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: riscv64-crossjit
          path: ${{ runner.temp }}/riscv/crossjit

      - name: Build riscv64 cross JIT (first run only)
        shell: bash
        env:
          RUNTIME_VER: ${{ steps.sdk.outputs.runtime_ver }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/riscv"
          mkdir -p "$work/crossjit"
          jit="$work/crossjit/libclrjit_unix_riscv64_x64.so"
          if [ -f "$jit" ]; then
            echo "Cross JIT restored from cache or artifact."
            file "$jit"
            exit 0
          fi
          # dotnet/runtime's own Linux prerequisite list. Probing for individual commands is
          # not enough: the PAL configure step hard-fails when FEATURE_EVENTSOURCE_XPLAT is
          # on and liblttng-ust-dev is missing, and that is a header/package check no
          # command probe would catch.
          sudo apt-get update
          sudo apt-get install -y build-essential cmake llvm lld clang \
            python-is-python3 curl git libicu-dev liblttng-ust-dev \
            libssl-dev libkrb5-dev ninja-build pigz cpio binutils file
          src="$RUNNER_TEMP/runtime-src"
          git clone --depth 1 --branch "v$RUNTIME_VER" https://github.com/dotnet/runtime "$src"
          cd "$src"
          # Build the host-runnable riscv64 JIT. Two things matter here:
          #
          # 1. clr.alljitscommunity sets "-component alljits" AND
          #    -DCLR_CMAKE_BUILD_COMMUNITY_ALTJITS=1. create_standalone_jit installs every
          #    per-arch JIT under COMPONENT alljits, and the COMMUNITY_ALTJITS switch is what
          #    adds the riscv64 target to the AMD64/ARM64 host block in jit/CMakeLists.txt.
          #    Without the switch that block emits arm64/x64/win only, which is exactly what
          #    an earlier attempt produced.
          # 2. No -arch riscv64. That would ask for a riscv64 *target* build, which is the
          #    JIT that runs on riscv64, not the one that runs here and emits riscv64 code.
          #    A native host build gives clrjit_unix_riscv64_${ARCH_HOST_NAME} = _x64.
          ./build.sh clr.alljitscommunity -c release
          built=$(find "$src/artifacts/bin" -name 'libclrjit_unix_riscv64_x64.so' -print -quit)
          if [ -z "$built" ]; then
            echo "::error::Build produced no libclrjit_unix_riscv64_x64.so." >&2
            echo "Artifacts containing 'clrjit':" >&2
            find "$src/artifacts/bin" -name '*clrjit*' -printf '  %p\n' 2>/dev/null >&2 || true
            exit 1
          fi
          file "$built"
          # getJit is exported with a version suffix (getJit@@V1.0), so do not anchor the
          # match at the end of the line.
          nm -D "$built" | grep -qE ' getJit(@@|$)' || {
            echo "::error::Built JIT does not export getJit." >&2
            exit 1
          }
          file "$built" | grep -q "x86-64" || {
            echo "::error::Built JIT is not an x86-64 ELF; the host build did not produce a host-loadable JIT." >&2
            exit 1
          }
          cp "$built" "$jit"
          # The checkout plus build tree is several GB; free it before the publish continues.
          cd /
          rm -rf "$src"
          echo "Staged cross JIT as $jit"

      # Published so the fallback above can pick it up on a later run. A timeout kills the
      # job outright and no later step runs, so this only makes the *next* run cheap.
      - name: Upload cross JIT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riscv64-crossjit
          path: ${{ runner.temp }}/riscv/crossjit/libclrjit_unix_riscv64_x64.so
          if-no-files-found: warn
          retention-days: 30

      - name: Stage the cross JIT into the ilc host
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/riscv"
          jit="$work/crossjit/libclrjit_unix_riscv64_x64.so"
          [ -f "$jit" ] || { echo "::error::Cross JIT is missing at $jit." >&2; exit 1; }
          cp "$jit" "$work/ilc-host-x64/tools/"
          ls -l "$work/ilc-host-x64/tools/"

      - name: Publish NativeAOT (cross container)
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          TAG: ${{ steps.sdk.outputs.tag }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/riscv"
          mkdir -p "$work/out" "$work/home"
          cat > "$work/container.sh" <<'CONTAINER'
          set -euo pipefail
          export DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1
          export DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
          export DOTNET_ReadyToRun=0
          export DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER=1
          export DOTNET_CLI_HOME=/work/home HOME=/work/home

          # The cross image sets no WORKDIR (it runs as /), so anchor every relative path.
          cd /work/src

          # No emulator is installed: ilc runs natively and only the RyuJIT it loads emits
          # riscv64 code, so nothing in this container executes riscv64 instructions.

          # Mixed SDK: official x64 host/runtime with the community managed sdk tree
          # (its Microsoft.NET.Build.Tasks knows the linux-riscv64 packs). The six
          # riscv64-native files inside the tree are overlaid back with official x64
          # binaries so MSBuild/Roslyn run natively on the host.
          mkdir -p /work/dotnet-x64 /work/community
          tar xzf /work/sdk-x64.tar.gz -C /work/dotnet-x64
          tar xzf /work/sdk-riscv64.tar.gz -C /work/community ./sdk
          official_ver=$(ls /work/dotnet-x64/sdk)
          comm_ver=$(ls /work/community/sdk)
          mkdir -p /tmp/official
          for f in MSBuild libdotnet-aot.so Roslyn/bincore/VBCSCompiler Roslyn/bincore/csc Roslyn/bincore/vbc AppHostTemplate/apphost; do
            mkdir -p "/tmp/official/$(dirname "$f")"
            cp "/work/dotnet-x64/sdk/$official_ver/$f" "/tmp/official/$f"
          done
          rm -rf "/work/dotnet-x64/sdk/$official_ver"
          cp -r "/work/community/sdk/$comm_ver" "/work/dotnet-x64/sdk/$comm_ver"
          for f in MSBuild libdotnet-aot.so Roslyn/bincore/VBCSCompiler Roslyn/bincore/csc Roslyn/bincore/vbc AppHostTemplate/apphost; do
            cp "/tmp/official/$f" "/work/dotnet-x64/sdk/$comm_ver/$f"
          done
          export DOTNET_ROOT=/work/dotnet-x64
          export PATH="/work/dotnet-x64:$PATH"

          cat > /work/src/NuGet.config <<'NUGET'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <Clear />
              <add key="local-riscv64" value="/work/nuget-local" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          NUGET

          dotnet --info
          dotnet publish "$PUBLISH_PROJECT" \
            -c Release -r linux-riscv64 --self-contained true \
            -p:DebugType=none -p:DebugSymbols=false \
            -p:Version="$VERSION" -p:VersionChannel="$CHANNEL" \
            -p:NETCoreSdkPortableRuntimeIdentifier=linux-x64 \
            -p:IlcHostRuntimeIdentifier=linux-x64 \
            -p:IlcHostPackagePath=/work/ilc-host-x64 \
            -p:SysRoot=/crossrootfs/riscv64 \
            -p:LinkerFlavor=lld \
            -nr:false \
            -o /work/out
          CONTAINER

          docker run --rm --platform linux/amd64 \
            -v "$work:/work" \
            -v "$GITHUB_WORKSPACE:/work/src" \
            -e VERSION="$VERSION" -e CHANNEL="$CHANNEL" \
            -e PUBLISH_PROJECT="$PUBLISH_PROJECT" \
            "$CROSS_IMAGE" bash /work/container.sh

          mkdir -p "$RUNNER_TEMP/publish"
          cp -R "$work/out/." "$RUNNER_TEMP/publish/"
          if [ -f "$RUNNER_TEMP/publish/UotanStudio.Desktop" ]; then
            file "$RUNNER_TEMP/publish/UotanStudio.Desktop"
          else
            echo "::warning::UotanStudio.Desktop is missing from the publish output."
          fi
          # NativeAOT leaves one native executable and no managed app assemblies behind. A
          # leftover UotanStudio.Desktop.dll means the publish silently fell back to a
          # framework-dependent build, so report it instead of shipping it unnoticed.
          if ls "$RUNNER_TEMP/publish"/UotanStudio*.dll >/dev/null 2>&1; then
            echo "::warning::Managed assemblies are present in the publish output; the build is not a NativeAOT publish."
          fi
          if [ -f "$RUNNER_TEMP/publish/UotanStudio.Desktop" ]; then
            if readelf -d "$RUNNER_TEMP/publish/UotanStudio.Desktop" 2>/dev/null | grep -q "libcoreclr"; then
              echo "::warning::The published binary links libcoreclr; the build is not a NativeAOT publish."
            fi
          fi
          test -f "$RUNNER_TEMP/publish/libSkiaSharp.so" \
            || echo "::warning::libSkiaSharp.so is missing from the publish output; check the RID asset resolution."
          file "$RUNNER_TEMP/publish/libSkiaSharp.so" 2>/dev/null || true

      - name: Package (tar.gz)
        shell: bash
        run: |
          cd "$RUNNER_TEMP/publish"
          find . -type f \( -name "*.pdb" -o -name "*.dbg" -o -name "*.xml" \) -delete
          chmod +x UotanStudio.Desktop 2>/dev/null || true
          find . -type d -empty -delete
          tar -czf "$RUNNER_TEMP/uotanstudio-linux-riscv64.tar.gz" -C "$RUNNER_TEMP/publish" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uotanstudio-${{ steps.ver.outputs.version }}-linux-riscv64
          path: ${{ runner.temp }}/uotanstudio-linux-riscv64.tar.gz
          if-no-files-found: error
          retention-days: 30
