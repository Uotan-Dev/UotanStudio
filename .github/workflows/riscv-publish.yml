name: Publish linux-riscv64 (cross)

on:
  workflow_dispatch:
    inputs:
      sdk_release:
        description: "dotnet-riscv tag (empty = newest 11.0)"
        required: false
        default: ""
      runtime_tag:
        description: "dotnet/runtime ABI tag for the cross JIT + ILCompiler host pack (empty = derive from SDK band)"
        required: false
        default: ""
      version:
        description: "Override version (defaults to Version.props / run number)"
        required: false
        default: ""

concurrency:
  group: riscv-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  PUBLISH_PROJECT: "UotanStudio.Desktop/UotanStudio.Desktop.csproj"
  CROSS_IMAGE: "mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-riscv64"

jobs:
  publish:
    name: linux-riscv64
    runs-on: ubuntu-24.04
    # 360 is the platform ceiling for a single job. This used to be 240, so long runs
    # were cancelled by our own limit well before GitHub would have stepped in.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          prefix=$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Version.props | head -1)
          channel=$(sed -n 's:.*<VersionChannel>\([^<]*\)</VersionChannel>.*:\1:p' Version.props | head -1)
          channel="${channel:-beta}"
          version="${prefix:-1.0.0}-${channel}.${GITHUB_RUN_NUMBER}"
          input="${{ github.event.inputs.version }}"
          if [ -n "$input" ]; then version="${input#v}"; fi
          if [ -z "$version" ] || [ -z "$channel" ]; then
            echo "::error::Resolved version or channel is empty (version='$version', channel='$channel')." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version ($channel)"

      - name: Resolve community SDK
        id: sdk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ github.event.inputs.sdk_release }}
          WANT_RUNTIME_TAG: ${{ github.event.inputs.runtime_tag }}
        run: |
          set -euo pipefail
          tfm=$(sed -n 's/.*<TargetFramework[^>]*>net\([0-9][0-9.]*\).*<\/TargetFramework>.*/\1/p' Directory.Build.props | head -1)
          want="${WANT:-$(printf '%s' "$tfm" | cut -d. -f1,2)}"
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            -o releases.json "https://api.github.com/repos/filipnavara/dotnet-riscv/releases?per_page=100"
          resolved=$(jq -r --arg want "$want" '
            [ .[] | select(.draft == false) | . as $rel | (.assets // [])[]
              | select(.state == "uploaded")
              | select(.name | startswith("dotnet-sdk-"))
              | select(.name | endswith("-linux-riscv64.tar.gz"))
              | select((.name | contains("musl")) | not)
              | { tag: $rel.tag_name, published: ($rel.published_at // ""),
                  version: (.name | sub("^dotnet-sdk-"; "") | sub("-linux-.*$"; "")) } ]
            | map(select(.version | startswith($want)))
            | sort_by(.published) | reverse | .[0]
            | if . == null then "" else [.tag, .version] | @tsv end' releases.json)
          if [ -z "$resolved" ]; then
            echo "::error::No dotnet-riscv SDK release matches prefix '$want'." >&2
            exit 1
          fi
          IFS=$'\t' read -r tag ver <<< "$resolved"
          if [ -z "$tag" ] || [ -z "$ver" ]; then
            echo "::error::Resolved release is missing a tag or version ('$resolved')." >&2
            exit 1
          fi
          sdk_url=$(jq -r --arg tag "$tag" --arg ver "$ver" '
            [.[] | select(.tag_name == $tag) | .assets // [] | .[]
              | select(.name == "dotnet-sdk-" + $ver + "-linux-riscv64.tar.gz")][0].browser_download_url // ""' releases.json)
          sdk_digest=$(jq -r --arg tag "$tag" --arg ver "$ver" '
            [.[] | select(.tag_name == $tag) | .assets // [] | .[]
              | select(.name == "dotnet-sdk-" + $ver + "-linux-riscv64.tar.gz")][0].digest // ""' releases.json)
          artifacts_url=$(jq -r --arg tag "$tag" '
            [.[] | select(.tag_name == $tag) | .assets // [] | .[]
              | select(.state == "uploaded")
              | select(.name | startswith("Private.SourceBuilt.Artifacts."))
              | select(.name | endswith(".linux-riscv64.tar.gz"))
              | select((.name | contains("musl")) | not)
              | .browser_download_url][0] // ""' releases.json)
          if [ -z "$sdk_url" ] || [ -z "$artifacts_url" ]; then
            echo "::error::Release $tag is missing the SDK or Private.SourceBuilt.Artifacts asset." >&2
            exit 1
          fi
          for pair in "sdk_url=$sdk_url" "artifacts_url=$artifacts_url"; do
            value="${pair#*=}"
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::Release $tag resolved a null asset URL for ${pair%%=*}." >&2
              exit 1
            fi
          done
          runtime_tag="$WANT_RUNTIME_TAG"
          if [ -z "$runtime_tag" ]; then
            sdk3=$(printf '%s' "$ver" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
            if [ -z "$sdk3" ]; then
              echo "::error::Cannot derive a runtime ABI version from SDK version '$ver'." >&2
              exit 1
            fi
            runtime_tag=$(printf '%s' "$sdk3" | awk -F. '{ p = int($3 / 100) - 1; if (p < 0) p = 0; printf "%s.%s.%d", $1, $2, p }')
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "sdk_url=$sdk_url" >> "$GITHUB_OUTPUT"
          echo "sdk_digest=$sdk_digest" >> "$GITHUB_OUTPUT"
          echo "artifacts_url=$artifacts_url" >> "$GITHUB_OUTPUT"
          echo "runtime_ver=$runtime_tag" >> "$GITHUB_OUTPUT"
          echo "::notice::dotnet-riscv SDK $tag ($ver), runtime ABI $runtime_tag"

      - name: Download SDKs and artifacts
        shell: bash
        env:
          SDK_URL: ${{ steps.sdk.outputs.sdk_url }}
          SDK_DIGEST: ${{ steps.sdk.outputs.sdk_digest }}
          ARTIFACTS_URL: ${{ steps.sdk.outputs.artifacts_url }}
          TAG: ${{ steps.sdk.outputs.tag }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/riscv"
          mkdir -p "$work"
          curl -fL --retry 3 -o "$work/sdk-riscv64.tar.gz" "$SDK_URL"
          if [[ "$SDK_DIGEST" == sha256:* ]]; then
            echo "${SDK_DIGEST#sha256:}  $work/sdk-riscv64.tar.gz" | sha256sum -c -
          else
            echo "::warning::SDK asset has no sha256 digest; skipping the integrity check."
          fi
          curl -fL --retry 3 -o "$work/artifacts-riscv64.tar.gz" "$ARTIFACTS_URL"
          official=$(printf '%s' "$TAG" | grep -oE '^v?[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$official" ]; then
            echo "::error::Cannot derive an official SDK version from tag '$TAG'." >&2
            exit 1
          fi
          curl -fL --retry 3 -o "$work/sdk-x64.tar.gz" \
            "https://builds.dotnet.microsoft.com/dotnet/Sdk/$official/dotnet-sdk-$official-linux-x64.tar.gz"

      - name: Restore riscv64 cross JIT cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/riscv/crossjit
          key: riscv64-crossjit-${{ runner.os }}-v${{ steps.sdk.outputs.runtime_ver }}

      # The cache above is saved by its post-step, which does NOT run when the job is
      # cancelled by a timeout. So a run cut off mid-JIT leaves no cache and the next
      # attempt starts over. Pull a previously uploaded JIT artifact as a fallback, so
      # the expensive build only has to succeed once.
      - name: Restore cross JIT artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: riscv64-crossjit
          path: ${{ runner.temp }}/riscv/crossjit

      - name: Build riscv64 cross JIT (first run only)
        shell: bash
        env:
          RUNTIME_VER: ${{ steps.sdk.outputs.runtime_ver }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/riscv"
          mkdir -p "$work/crossjit"
          jit="$work/crossjit/libclrjit_unix_riscv64_x64.so"
          if [ -f "$jit" ]; then
            echo "Cross JIT restored from cache."
            file "$jit"
            exit 0
          fi
          need_install=""
          command -v cmake >/dev/null 2>&1 || need_install="$need_install cmake"
          command -v ninja >/dev/null 2>&1 || need_install="$need_install ninja-build"
          command -v clang >/dev/null 2>&1 || need_install="$need_install clang"
          command -v nm >/dev/null 2>&1 || need_install="$need_install binutils"
          command -v file >/dev/null 2>&1 || need_install="$need_install file"
          if [ -n "$need_install" ]; then
            sudo apt-get update
            sudo apt-get install -y$need_install
          fi
          src="$RUNNER_TEMP/runtime-src"
          git clone --depth 1 --branch "v$RUNTIME_VER" https://github.com/dotnet/runtime "$src"
          cd "$src"
          ./build.sh clr.crossarchtools -os linux -arch riscv64 -c release
          built=$(find "$src/artifacts/bin" -name 'libclrjit*.so' -print -quit)
          if [ -z "$built" ]; then
            echo "::error::Cross-component build produced no libclrjit*.so." >&2
            exit 1
          fi
          file "$built"
          nm -D "$built" | grep -qE ' getJit$' || {
            echo "::error::Built JIT does not export getJit." >&2
            exit 1
          fi
          file "$built" | grep -q "x86-64" || {
            echo "::error::Built JIT is not an x86-64 ELF (cross-component mode did not engage)." >&2
            exit 1
          fi
          cp "$built" "$jit"
          # The checkout plus build tree is several GB; free it before the publish job continues.
          cd /
          rm -rf "$src"
          echo "Staged cross JIT as $jit"

      # Published so the fallback above can pick it up on a later run. Note this does
      # not rescue a run that is already timing out: a timeout kills the job outright
      # and no later step runs. It makes the *next* run cheap.
      - name: Upload cross JIT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riscv64-crossjit
          path: ${{ runner.temp }}/riscv/crossjit/libclrjit_unix_riscv64_x64.so
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare local feed and ilc host
        shell: bash
        env:
          RUNTIME_VER: ${{ steps.sdk.outputs.runtime_ver }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/riscv"
          mkdir -p "$work/nuget-local" "$work/ilc-host-x64"

          artlist=$(tar tzf "$work/artifacts-riscv64.tar.gz")
          pick() { printf '%s\n' "$artlist" | grep -E "^$1\$" | head -1; }
          naot=$(pick "Microsoft\.NETCore\.App\.Runtime\.NativeAOT\.linux-riscv64\.[0-9][^/]*\.nupkg")
          ref=$(pick "Microsoft\.NETCore\.App\.Ref\.[0-9][^/]*\.nupkg")
          host=$(pick "Microsoft\.NETCore\.App\.Host\.linux-riscv64\.[0-9][^/]*\.nupkg")
          runtime=$(pick "Microsoft\.NETCore\.App\.Runtime\.linux-riscv64\.[0-9][^/]*\.nupkg")
          ilc=$(pick "runtime\.linux-riscv64\.Microsoft\.DotNet\.ILCompiler\.[0-9][^/]*\.nupkg")
          ilcm=$(pick "Microsoft\.DotNet\.ILCompiler\.[0-9][^/]*\.nupkg")
          aspnet=$(pick "Microsoft\.AspNetCore\.App\.Runtime\.linux-riscv64\.[0-9][^/]*\.nupkg")
          aspnetref=$(pick "Microsoft\.AspNetCore\.App\.Ref\.[0-9][^/]*\.nupkg")
          paths=()
          for p in "$naot" "$ref" "$host" "$runtime" "$ilc" "$ilcm" "$aspnet" "$aspnetref"; do
            [ -n "$p" ] || { echo "::error::Required package missing from Private.SourceBuilt.Artifacts." >&2; exit 1; }
            paths+=("$p")
          done
          # One list pass plus one extract pass; per-package `-O` pipes would rescan the
          # ~780 MB archive once per package.
          tar xzf "$work/artifacts-riscv64.tar.gz" -C "$work/nuget-local" "${paths[@]}"

          curl -fL --retry 3 -o "$work/ilc-host-x64.nupkg" \
            "https://api.nuget.org/v3-flatcontainer/runtime.linux-x64.microsoft.dotnet.ilcompiler/$RUNTIME_VER/runtime.linux-x64.microsoft.dotnet.ilcompiler.$RUNTIME_VER.nupkg"
          unzip -q "$work/ilc-host-x64.nupkg" -d "$work/ilc-host-x64"
          cp "$work/crossjit/libclrjit_unix_riscv64_x64.so" "$work/ilc-host-x64/tools/"
          for f in tools/ilc tools/libjitinterface_x64.so tools/libclrjit_unix_riscv64_x64.so native/src/libs/build-local.sh; do
            [ -f "$work/ilc-host-x64/$f" ] || { echo "::error::ILCompiler host pack is missing $f." >&2; exit 1; }
          done
          file "$work/ilc-host-x64/tools/ilc" | grep -q "x86-64" || {
            echo "::error::tools/ilc is not an x86-64 binary." >&2
            exit 1
          }

      - name: Restore NuGet cache for the publish container
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/riscv/nuget-cache
          key: riscv64-nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            riscv64-nuget-${{ runner.os }}-

      - name: Publish NativeAOT (cross container)
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/riscv"
          mkdir -p "$work/out" "$work/home" "$work/nuget-http"
          cat > "$work/container.sh" <<'CONTAINER'
          set -euo pipefail
          export DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1
          export DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
          export DOTNET_ReadyToRun=0
          export DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER=1
          export DOTNET_CLI_HOME=/work/home HOME=/work/home
          # Restore into bind-mounted caches so repeat runs skip re-downloading every package.
          export NUGET_PACKAGES=/work/nuget-cache NUGET_HTTP_CACHE_PATH=/work/nuget-http
          mkdir -p "$NUGET_PACKAGES" "$NUGET_HTTP_CACHE_PATH"

          cd /work/src
          mkdir -p /work/dotnet-x64 /work/community
          tar xzf /work/sdk-x64.tar.gz -C /work/dotnet-x64
          tar xzf /work/sdk-riscv64.tar.gz -C /work/community ./sdk
          official_ver=$(ls /work/dotnet-x64/sdk)
          comm_ver=$(ls /work/community/sdk)
          mkdir -p /tmp/official
          for f in MSBuild libdotnet-aot.so Roslyn/bincore/VBCSCompiler Roslyn/bincore/csc Roslyn/bincore/vbc AppHostTemplate/apphost; do
            mkdir -p "/tmp/official/$(dirname "$f")"
            cp "/work/dotnet-x64/sdk/$official_ver/$f" "/tmp/official/$f"
          done
          rm -rf "/work/dotnet-x64/sdk/$official_ver"
          cp -r "/work/community/sdk/$comm_ver" "/work/dotnet-x64/sdk/$comm_ver"
          for f in MSBuild libdotnet-aot.so Roslyn/bincore/VBCSCompiler Roslyn/bincore/csc Roslyn/bincore/vbc AppHostTemplate/apphost; do
            cp "/tmp/official/$f" "/work/dotnet-x64/sdk/$comm_ver/$f"
          done
          export DOTNET_ROOT=/work/dotnet-x64
          export PATH="/work/dotnet-x64:$PATH"

          cat > /work/src/NuGet.config <<'NUGET'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <Clear />
              <add key="local-riscv64" value="/work/nuget-local" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          NUGET

          dotnet --info
          dotnet publish "$PUBLISH_PROJECT" \
            -c Release -r linux-riscv64 --self-contained true \
            -p:DebugType=none -p:DebugSymbols=false \
            -p:Version="$VERSION" -p:VersionChannel="$CHANNEL" \
            -p:NETCoreSdkPortableRuntimeIdentifier=linux-x64 \
            -p:IlcHostRuntimeIdentifier=linux-riscv64 \
            -p:IlcHostPackagePath=/work/ilc-host-x64 \
            -p:SysRoot=/crossrootfs/riscv64 \
            -p:LinkerFlavor=lld \
            -nr:false \
            -o /work/out
          CONTAINER

          docker run --rm --platform linux/amd64 \
            -v "$work:/work" \
            -v "$GITHUB_WORKSPACE:/work/src" \
            -e VERSION="$VERSION" -e CHANNEL="$CHANNEL" \
            -e PUBLISH_PROJECT="$PUBLISH_PROJECT" \
            "$CROSS_IMAGE" bash /work/container.sh

          mkdir -p "$RUNNER_TEMP/publish"
          cp -R "$work/out/." "$RUNNER_TEMP/publish/"
          if [ -f "$RUNNER_TEMP/publish/UotanStudio.Desktop" ]; then
            file "$RUNNER_TEMP/publish/UotanStudio.Desktop"
          fi
          echo "::warning::SkiaSharp has no linux-riscv64 native assets; the published GUI binary needs a source-built libSkiaSharp to render."

      - name: Package (tar.gz)
        shell: bash
        run: |
          cd "$RUNNER_TEMP/publish"
          find . -type f \( -name "*.pdb" -o -name "*.dbg" -o -name "*.xml" \) -delete
          chmod +x UotanStudio.Desktop 2>/dev/null || true
          find . -type d -empty -delete
          tar -czf "$RUNNER_TEMP/uotanstudio-linux-riscv64.tar.gz" -C "$RUNNER_TEMP/publish" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uotanstudio-${{ steps.ver.outputs.version }}-linux-riscv64
          path: ${{ runner.temp }}/uotanstudio-linux-riscv64.tar.gz
          if-no-files-found: error
          retention-days: 30
